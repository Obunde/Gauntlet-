[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.1.0"
description = "AI security release gate"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "pytest",
    "python-dotenv",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["gauntlet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
