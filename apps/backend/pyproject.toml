[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.1.0"
description = "AI security release gate"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "pyyaml",
    "pytest",
    "pydantic>=2",
    "httpx",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["gauntlet*", "target_agent*"]

[tool.setuptools.package-data]
gauntlet = ["engine/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
